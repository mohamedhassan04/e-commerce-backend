name: mamolej

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mamolej-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      UPLOADS_DIR: /app/uploads
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${UPLOADS_HOST_PATH:-./uploads}
        target: /app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DATABASE:?Set POSTGRES_DATABASE in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${UPLOADS_HOST_PATH:-./uploads}
        target: /var/www/uploads
        read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
