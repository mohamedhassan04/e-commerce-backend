name: mamolej

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mamolej-api:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 8080
      UPLOADS_DIR: /app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - api_egress
      - database_private
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: /srv/mamolej/uploads
        target: /app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: mamolej_postgres_data
    driver: local

networks:
  api_egress:
    name: mamolej_api_egress
    driver: bridge
  database_private:
    name: mamolej_database_private
    driver: bridge
    internal: true
